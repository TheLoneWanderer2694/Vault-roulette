<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBS Spinning Wheel & Twitch Chat Trigger</title>
  <style>
    :root {
      --bg-color: #0e0e10;
      --panel-bg: #18181b;
      --accent: #9146ff;
      --accent-hover: #772ce8;
      --text: #efeff1;
      --text-muted: #adadb8;
      --border: #26262c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* OBS Transparent background mode when loaded with ?obs=true */
    body.obs-mode {
      background-color: transparent !important;
    }
    body.obs-mode .controls-panel {
      display: none !important;
    }
    body.obs-mode .stage {
      width: 100vw;
      height: 100vh;
    }

    /* Layout */
    .controls-panel {
      width: 360px;
      background: var(--panel-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
      overflow-y: auto;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    h2, h3 { color: #fff; margin-bottom: 8px; }
    label { font-size: 12px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
    
    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0002;
      color: #fff;
      font-size: 14px;
    }

    button {
      background: var(--accent);
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }

    /* Wheel Styling */
    .wheel-container {
      position: relative;
      width: 450px;
      height: 450px;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: calc(50% - 15px);
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid #ff4757;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .status-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #333;
    }
    .status-badge.connected { background: #2ed573; color: #000; }
    .status-badge.error { background: #ff4757; color: #fff; }

    /* Modal / Winner Banner */
    .winner-banner {
      position: absolute;
      bottom: 40px;
      background: rgba(0,0,0,0.85);
      border: 2px solid var(--accent);
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-align: center;
      display: none;
      box-shadow: 0 0 15px var(--accent);
    }
    .winner-banner.show { display: block; animation: pop 0.3s ease-out; }

    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Controls Panel (Hidden in OBS Browser Source) -->
  <div class="controls-panel">
    <h2>Wheel Config</h2>
    
    <div>
      <label>Twitch Channel</label>
      <input type="text" id="channelInput" placeholder="e.g. streamer_name">
      <button onclick="connectTwitch()" style="margin-top: 6px;">Connect Chat</button>
    </div>

    <div>
      <label>Wheel Options (One per line)</label>
      <textarea id="itemsInput" rows="6" style="width:100%; padding:8px; background:#0002; color:#fff; border:1px solid var(--border); border-radius:6px; resize:vertical;"></textarea>
    </div>

    <button onclick="updateWheelFromInput()">Update Items</button>
    <button onclick="spinWheel()" style="background: #2ed573; color: #000;">Spin Wheel Now</button>

    <hr style="border:0; border-top:1px solid var(--border);">

    <div>
      <label>OBS Link Generator</label>
      <button onclick="generateOBSLink()" style="margin-top:6px; background:#eccc68; color:#000;">Copy OBS Source URL</button>
    </div>
  </div>

  <!-- Stage Area -->
  <div class="stage">
    <div id="twitchStatus" class="status-badge">Chat: Disconnected</div>
    
    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheelCanvas" width="500" height="500"></canvas>
    </div>

    <div id="winnerBanner" class="winner-banner">
      Winner: <span id="winnerText">---</span>
    </div>
  </div>

  <script>
    // System State
    let items = ["Game 1", "Game 2", "Game 3", "Game 4", "Game 5", "Game 6"];
    const colors = ["#ff4757", "#2ed573", "#1e90ff", "#ffa502", "#9b59b6", "#70a6ff"];
    let currentAngle = 0;
    let isSpinning = false;
    let ws = null;

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    // Parse URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('obs') === 'true') {
      document.body.classList.add('obs-mode');
    }
    if (urlParams.get('items')) {
      items = urlParams.get('items').split(',').map(i => i.trim()).filter(i => i);
    }
    const channelParam = urlParams.get('channel');

    // Initial render
    document.getElementById('itemsInput').value = items.join('\n');
    drawWheel();

    if (channelParam) {
      document.getElementById('channelInput').value = channelParam;
      connectTwitchChannel(channelParam);
    }

    // Draw Spinning Wheel
    function drawWheel() {
      const numSegments = items.length;
      if (numSegments === 0) return;
      const arcSize = (2 * Math.PI) / numSegments;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;

      for (let i = 0; i < numSegments; i++) {
        const angle = currentAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
        ctx.lineTo(centerX, centerY);
        ctx.fill();
        ctx.stroke();

        // Text
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 18px sans-serif";
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.fillText(items[i], radius - 20, 6);
        ctx.restore();
      }
    }

    // Update segments from textarea
    function updateWheelFromInput() {
      const text = document.getElementById('itemsInput').value;
      items = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      drawWheel();
    }

    // Spin Logic
    function spinWheel() {
      if (isSpinning || items.length === 0) return;
      isSpinning = true;
      document.getElementById('winnerBanner').classList.remove('show');

      const spinDuration = 4000; // ms
      const startAngle = currentAngle;
      const totalRotation = Math.PI * 2 * (5 + Math.random() * 5); // 5 to 10 full turns
      const startTime = performance.now();

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        if (elapsed < spinDuration) {
          // Ease out cubic
          const progress = elapsed / spinDuration;
          const easeOut = 1 - Math.pow(1 - progress, 3);
          currentAngle = startAngle + easeOut * totalRotation;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          currentAngle = startAngle + totalRotation;
          drawWheel();
          isSpinning = false;
          determineWinner();
        }
      }
      requestAnimationFrame(animate);
    }

    // Determine Winner
    function determineWinner() {
      const numSegments = items.length;
      const arcSize = (2 * Math.PI) / numSegments;
      
      // Top pointer is at 270 degrees (3 * Math.PI / 2)
      let normalizedAngle = (3 * Math.PI / 2 - currentAngle) % (2 * Math.PI);
      if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

      const winnerIndex = Math.floor(normalizedAngle / arcSize);
      const winner = items[winnerIndex] || items[0];

      document.getElementById('winnerText').innerText = winner;
      document.getElementById('winnerBanner').classList.add('show');
    }

    // Native Twitch IRC WebSocket Client (Zero Dependency)
    function connectTwitch() {
      const ch = document.getElementById('channelInput').value.trim().toLowerCase();
      if (ch) connectTwitchChannel(ch);
    }

    function connectTwitchChannel(channel) {
      const badge = document.getElementById('twitchStatus');
      badge.innerText = "Connecting...";
      badge.className = "status-badge";

      if (ws) {
        ws.close();
      }

      ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

      ws.onopen = () => {
        ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
        ws.send('PASS schmoopiie');
        ws.send(`NICK justinfan${Math.floor(10000 + Math.random() * 90000)}`);
        ws.send(`JOIN #${channel}`);
        badge.innerText = `Chat: Connected (${channel})`;
        badge.classList.add('connected');
      };

      ws.onmessage = (event) => {
        const message = event.data;
        if (message.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
        } else if (message.includes('PRIVMSG')) {
          // Check for !spin command
          const parts = message.split('PRIVMSG');
          const chatText = parts[1] ? parts[1].split(':')[1] : '';
          if (chatText && chatText.trim().toLowerCase().startsWith('!spin')) {
            spinWheel();
          }
        }
      };

      ws.onerror = () => {
        badge.innerText = "Connection Failed";
        badge.classList.add('error');
      };

      ws.onclose = () => {
        badge.innerText = "Disconnected";
        badge.className = "status-badge";
      };
    }

    // Generate Copyable OBS URL
    function generateOBSLink() {
      const channel = document.getElementById('channelInput').value.trim();
      const encodedItems = encodeURIComponent(items.join(','));
      const baseUrl = window.location.href.split('?')[0];
      
      const obsUrl = `${baseUrl}?obs=true&channel=${encodeURIComponent(channel)}&items=${encodedItems}`;
      
      navigator.clipboard.writeText(obsUrl).then(() => {
        alert("OBS Source URL copied to clipboard!\nAdd it as a Browser Source in OBS.");
      }).catch(() => {
        prompt("Copy this URL for your OBS Browser Source:", obsUrl);
      });
    }
  </script>
</body>
</html>
